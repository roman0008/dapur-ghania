<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dapur Ghania – Web Order Produksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- HEADER -->
<header class="bg-pink-600 text-white p-4 flex justify-between items-center sticky top-0 z-40">
  <h1 class="font-bold text-lg">Dapur Ghania</h1>
  <button onclick="openCart()" class="relative text-xl">🛒
    <span id="cartBadge" class="absolute -top-2 -right-2 bg-white text-pink-600 text-xs px-2 rounded-full">0</span>
  </button>
</header>

<!-- MAIN -->
<main class="p-4">
  <h2 class="font-bold mb-3">Daftar Produk</h2>
  <div id="productList" class="grid grid-cols-2 gap-3"></div>
</main>

<!-- CART MODAL -->
<div id="cartModal" class="fixed inset-0 bg-black/50 hidden items-end z-50">
  <div class="bg-white w-full rounded-t-xl p-4">
    <h3 class="font-bold mb-2">Keranjang</h3>
    <div id="cartItems" class="text-sm mb-3"></div>
    <button onclick="checkout()" class="w-full bg-pink-600 text-white py-2 rounded">Checkout</button>
    <button onclick="closeCart()" class="w-full mt-2 text-sm">Tutup</button>
  </div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
  <div class="bg-white w-80 rounded-xl p-4">
    <h3 id="detailName" class="font-bold text-lg mb-1"></h3>
    <p id="detailPrice" class="text-pink-600 font-semibold mb-3"></p>
    <button onclick="addToCartFromDetail()" class="w-full bg-pink-600 text-white py-2 rounded">Tambah ke Keranjang</button>
    <button onclick="closeDetail()" class="w-full mt-2 text-sm">Tutup</button>
  </div>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
  <div class="bg-white p-4 rounded w-80">
    <h3 class="font-bold mb-2">Login</h3>
    <input id="authName" placeholder="Nama" class="border p-2 w-full mb-2" />
    <input id="authPhone" placeholder="No WhatsApp" class="border p-2 w-full mb-2" />
    <input id="authPin" placeholder="PIN (1234)" class="border p-2 w-full mb-3" />
    <button onclick="submitAuth()" class="w-full bg-pink-600 text-white py-2 rounded">Masuk</button>
  </div>
</div>

<script>
/********************
 * KONFIGURASI
 ********************/
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye27tkax-LNqEKFES3bjhEm4wO3e_lUV1WGCFJaAuCNCIYpvNPrgJLeSPsMdynlkP_xQ/exec";
const ADMIN_WA = "62895334016084";

/********************
 * STATE
 ********************/
let PRODUCTS = [];
let cart = JSON.parse(localStorage.getItem('cart') || '[]');
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
let selectedProduct = null;

/********************
 * INIT
 ********************/
updateCartBadge();
loadProducts();

/********************
 * API JSONP
 ********************/
function jsonp(url) {
  const s = document.createElement('script');
  s.src = url;
  document.body.appendChild(s);
}

/********************
 * LOAD PRODUCT
 ********************/
function loadProducts() {
  jsonp(`${SCRIPT_URL}?action=getProducts&callback=productCb`);
}
function productCb(data) {
  PRODUCTS = data || [];
  renderProducts();
}
function renderProducts() {
  const el = document.getElementById('productList');
  el.innerHTML = PRODUCTS.map((p, i) => `
    <div class="bg-white p-2 rounded shadow cursor-pointer" data-index="${i}" onclick="openDetailByIndex(${i})">
      <div class="font-semibold text-sm">${p.name}</div>
      <div class="text-xs">Rp ${p.price}</div>
    </div>
  `).join('');
}

/********************
 * DETAIL
 ********************/
function openDetailByIndex(i) {
  const p = PRODUCTS[i];
  if (!p) return alert('Produk tidak ditemukan');
  selectedProduct = p;
  document.getElementById('detailName').innerText = p.name;
  document.getElementById('detailPrice').innerText = 'Rp ' + p.price;
  document.getElementById('detailModal').classList.remove('hidden');
}

function closeDetail() {
  document.getElementById('detailModal').classList.add('hidden');
}
function closeDetail() {
  document.getElementById('detailModal').classList.add('hidden');
}

/********************
 * CART
 ********************/
function addToCartFromDetail() {
  if (!selectedProduct) {
    alert('Produk belum dipilih');
    return;
  }
  const found = cart.find(i => i.name === selectedProduct.name);
  if (found) {
    found.qty += 1;
  } else {
    cart.push({
      name: selectedProduct.name,
      price: selectedProduct.price,
      qty: 1
    });
  }
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
  closeDetail();
}
function saveCart() {
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartBadge();
}
function updateCartBadge() {
  document.getElementById('cartBadge').innerText = cart.reduce((t, i) => t + i.qty, 0);
}
function openCart() {
  document.getElementById('cartItems').innerHTML = cart.map(i => `${i.name} x${i.qty}`).join('<br>');
  document.getElementById('cartModal').classList.remove('hidden');
}
function closeCart() {
  document.getElementById('cartModal').classList.add('hidden');
}

/********************
 * AUTH
 ********************/
function submitAuth() {
  const n = authName.value;
  const p = authPhone.value;
  const pin = authPin.value;
  jsonp(`${SCRIPT_URL}?action=login&name=${n}&phone=${p}&pin=${pin}&callback=authCb`);
}
function authCb(res) {
  if (!res || res.error) return alert('Login gagal');
  currentUser = res;
  localStorage.setItem('user', JSON.stringify(res));
  document.getElementById('authModal').classList.add('hidden');
}

/********************
 * CHECKOUT
 ********************/
async function checkout() {
  if (!currentUser) return document.getElementById('authModal').classList.remove('hidden');
  if (cart.length === 0) return alert('Keranjang kosong');

  const fd = new FormData();
  fd.append('name', currentUser.name);
  fd.append('phone', currentUser.phone);
  fd.append('items', JSON.stringify(cart));
  fd.append('total', cart.reduce((t, i) => t + i.price * i.qty, 0));
  fd.append('date', new Date().toISOString().slice(0,10));
  fd.append('time', new Date().toLocaleTimeString('id-ID'));
  fd.append('payment_type', 'Transfer');
  fd.append('address', '-');
  fd.append('note', '-');

  await fetch(SCRIPT_URL, { method: 'POST', body: fd });

  window.open(`https://wa.me/${ADMIN_WA}?text=Halo%20Dapur%20Ghania,%20saya%20sudah%20checkout`, '_blank');
  cart = [];
  saveCart();
  closeCart();
}
</script>
</body>
</html>
