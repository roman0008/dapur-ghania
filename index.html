<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dapur Ghania - Sinkron Backend</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal-blur { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
    .nav-active { color: #ea580c; border-bottom: 3px solid #ea580c; font-weight: 900; }
    .hidden { display: none; }
    .page-content { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<script>
  // --- STATE MANAGEMENT ---
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbye27tkax-LNqEKFES3bjhEm4wO3e_lUV1WGCFJaAuCNCIYpvNPrgJLeSPsMdynlkP_xQ/exec"; 
  let currentUser = JSON.parse(localStorage.getItem('user')) || null;
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let products = []; 
  let selectedProduct = null;
  let searchKeyword = "";

  // --- CORE UTILS ---
  function injectScript(url) {
    const script = document.createElement("script");
    script.src = url;
    script.async = true;
    script.onerror = () => {
      showLoader(false);
      alert("Koneksi bermasalah dengan server.");
    };
    document.body.appendChild(script);
    script.onload = () => script.remove();
  }

  function showLoader(show, text = "Memuat...") {
    const loader = document.getElementById('global-loader');
    if (!loader) return;
    loader.classList.toggle('hidden', !show);
    document.getElementById('loader-text').innerText = text;
  }

  // --- AUTH LOGIC ---
  function handleAuth(e) {
    if(e) e.preventDefault();
    const name = document.getElementById('prof-name').value;
    const phone = document.getElementById('prof-phone').value;
    const pin = document.getElementById('prof-pin').value;
    
    if(!phone || !pin) return alert("Nomor HP dan PIN wajib diisi!");

    showLoader(true, "Menghubungkan...");
    const targetAction = name.trim() !== "" ? "register" : "login";
    injectScript(`${SCRIPT_URL}?action=${targetAction}&name=${encodeURIComponent(name)}&phone=${phone}&pin=${pin}&callback=authCb`);
  }

  window.authCb = (res) => {
    showLoader(false);
    if (res.success) {
      // Perbaikan: Memastikan role dari server tersimpan (Admin/User)
      currentUser = { 
        name: res.name || document.getElementById('prof-name').value || "Pelanggan", 
        phone: res.phone || document.getElementById('prof-phone').value,
        role: res.role ? res.role.toUpperCase() : "USER" 
      };
      localStorage.setItem('user', JSON.stringify(currentUser));
      
      const isFromCart = !document.getElementById('page-cart').classList.contains('hidden');
      alert(`${res.message || "Berhasil masuk!"} (Role: ${currentUser.role})`);
      updateAuthUI();

      if (isFromCart) {
        processCheckout(); 
      } else {
        showPage('home');
      }
    } else {
      alert("Gagal: " + res.message);
    }
  };

  function updateAuthUI() {
    const loginSection = document.getElementById('login-form-container');
    const profileSection = document.getElementById('profile-info-container');
    const logoutBtn = document.getElementById('logout-btn');
    const adminBadge = document.getElementById('admin-badge');

    if (currentUser) {
      loginSection.classList.add('hidden');
      profileSection.classList.remove('hidden');
      logoutBtn.classList.remove('hidden');
      document.getElementById('display-name').innerText = currentUser.name;
      document.getElementById('display-phone').innerText = currentUser.phone;
      document.getElementById('prof-title').innerText = "Profil Saya";
      
      // Tampilkan badge jika Admin
      if (currentUser.role === 'ADMIN') {
        adminBadge.classList.remove('hidden');
      } else {
        adminBadge.classList.add('hidden');
      }
    } else {
      loginSection.classList.remove('hidden');
      profileSection.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      adminBadge.classList.add('hidden');
      document.getElementById('prof-title').innerText = "Masuk / Daftar";
    }
  }

  function logout() {
    if(!confirm("Keluar dari akun?")) return;
    localStorage.removeItem('user');
    currentUser = null;
    location.reload();
  }

  // --- PRODUCT LOGIC ---
  function fetchProducts() {
    showLoader(true, "Mengambil Menu...");
    injectScript(`${SCRIPT_URL}?action=getProducts&callback=productsCb`);
  }

  window.productsCb = (res) => {
    showLoader(false);
    if (res.success && res.data) {
      products = res.data;
      renderProducts();
    }
  };

  function openProductDetail(product) {
    selectedProduct = product;
    document.getElementById('dp-img').src = product.image || 'https://via.placeholder.com/400x300?text=No+Image';
    document.getElementById('dp-name').innerText = product.name;
    document.getElementById('dp-desc').innerText = product.description || 'Tidak ada deskripsi.';
    document.getElementById('dp-price').innerText = `Rp ${Number(product.price || 0).toLocaleString('id-ID')}`;
    document.getElementById('modal-product').classList.remove('hidden');
  }

  function closeProductDetail() {
    selectedProduct = null;
    document.getElementById('modal-product').classList.add('hidden');
  }

  // --- CART LOGIC ---
  function addToCart(productId) {
    const p = products.find(x => x.id === productId) || selectedProduct;
    if (!p) return;
    
    const existing = cart.find(item => item.id === p.id);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ ...p, qty: 1 });
    }
    
    saveCart();
    alert("Ditambahkan ke keranjang!");
  }

  function saveCart() {
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
  }

  function updateCartBadge() {
    const count = cart.reduce((a, b) => a + b.qty, 0);
    const badges = document.querySelectorAll('.cart-count');
    badges.forEach(b => {
      b.innerText = count;
      b.classList.toggle('hidden', count === 0);
    });
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    saveCart();
    renderCart();
  }

  function renderCart() {
    const container = document.getElementById('cart-items');
    const totalEl = document.getElementById('cart-total');
    if (!container) return;

    if (cart.length === 0) {
      container.innerHTML = `<div class="py-20 text-center text-gray-400 text-sm italic">Keranjang belanja kosong</div>`;
      totalEl.innerText = "Rp 0";
      return;
    }

    let total = 0;
    container.innerHTML = cart.map((item, index) => {
      const subtotal = item.price * item.qty;
      total += subtotal;
      return `
        <div class="flex items-center gap-4 bg-white p-4 rounded-3xl border border-gray-100 mb-3 shadow-sm">
          <img src="${item.image}" class="w-16 h-16 object-cover rounded-2xl">
          <div class="flex-1">
            <h4 class="font-bold text-sm">${item.name}</h4>
            <p class="text-xs text-orange-600 font-black">${item.qty}x Rp ${Number(item.price).toLocaleString('id-ID')}</p>
          </div>
          <button onclick="removeFromCart(${index})" class="text-red-400 p-2 active:scale-90 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      `;
    }).join("");
    totalEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
  }

  // --- CHECKOUT LOGIC ---
  async function processCheckout() {
    if (!currentUser) {
      document.getElementById('modal-auth-prompt').classList.remove('hidden');
      return;
    }

    if (cart.length === 0) return alert("Keranjang kosong!");

    const address = document.getElementById('co-address').value;
    const date = document.getElementById('co-date').value;
    const time = document.getElementById('co-time').value;
    const note = document.getElementById('co-note').value;

    if(!address || !date || !time) return alert("Alamat, Tanggal, dan Jam Kirim wajib diisi!");

    const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
    const pesananStrings = cart.map(i => `${i.name} (${i.qty})`).join(", ");

    const formData = new URLSearchParams();
    formData.append("action", "addOrder");
    formData.append("Nama", currentUser.name);
    formData.append("No WA", currentUser.phone);
    formData.append("Tanggal", date);
    formData.append("Jam", time);
    formData.append("Pembayaran", "Transfer Manual");
    formData.append("Alamat", address);
    formData.append("Pesanan", pesananStrings);
    formData.append("Total", total);
    formData.append("Catatan", note || "-");
    formData.append("Dibayar", 0); 
    formData.append("Sisa", total); 
    formData.append("Ongkir", 0); 
    formData.append("Tracking", "PO MASUK");

    showLoader(true, "Memproses Pesanan...");

    try {
      const response = await fetch(`${SCRIPT_URL}?${formData.toString()}`, { method: 'GET' });
      alert("Pesanan Berhasil Dibuat! Silakan cek menu Riwayat.");
      cart = [];
      saveCart();
      showPage('history');
    } catch (e) {
      alert("Gagal mengirim pesanan. Periksa koneksi internet.");
    } finally {
      showLoader(false);
    }
  }

  // --- SEARCH & RENDER ---
  function handleSearch(val) {
    searchKeyword = val.toLowerCase().trim();
    renderProducts();
  }

  function renderProducts() {
    const container = document.getElementById('product-grid');
    if (!container) return;
    const filtered = products.filter(p => p.name.toLowerCase().includes(searchKeyword));
    container.innerHTML = filtered.map(p => `
      <div onclick='openProductDetail(${JSON.stringify(p)})' class="bg-white rounded-3xl p-3 border border-gray-100 shadow-sm active:scale-95 transition-all cursor-pointer">
        <img src="${p.image}" class="w-full h-32 object-cover rounded-2xl mb-2">
        <h4 class="font-bold text-sm truncate">${p.name}</h4>
        <p class="text-orange-600 font-black text-sm">Rp ${Number(p.price).toLocaleString('id-ID')}</p>
      </div>
    `).join("");
  }

  // --- NAVIGATION ---
  function showPage(page) {
    document.querySelectorAll(".page-content").forEach(p => p.classList.add("hidden"));
    const target = document.getElementById(`page-${page}`);
    if (target) target.classList.remove("hidden");

    document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("nav-active"));
    const nav = document.getElementById(`nav-${page}`);
    if (nav) nav.classList.add("nav-active");

    if (page === "cart") renderCart();
    if (page === "history") fetchUserHistory();
    if (page === "home" && products.length === 0) fetchProducts();
    if (page === "profile") updateAuthUI();
  }

  function fetchUserHistory() {
    const list = document.getElementById('history-list');
    if (!currentUser) {
      list.innerHTML = `<div class="py-20 text-center text-gray-400 text-xs italic">Masuk ke Profil untuk melihat riwayat</div>`;
      return;
    }
    list.innerHTML = `<div class="py-20 text-center animate-pulse text-xs">Memuat data pesanan...</div>`;
    
    // Perbaikan: Admin bisa melihat semua pesanan jika diperlukan, tapi default tetap filter per nomor HP
    const action = currentUser.role === "ADMIN" ? "getOrders" : "getOrders"; 
    injectScript(`${SCRIPT_URL}?action=${action}&phone=${currentUser.phone}&callback=historyCb`);
  }

  window.historyCb = (res) => {
    const list = document.getElementById("history-list");
    if (!list || !res.success) return;
    if (res.data.length === 0) {
      list.innerHTML = `<div class="py-20 text-center text-gray-400 text-xs italic">Belum ada pesanan</div>`;
      return;
    }
    list.innerHTML = res.data.map(o => `
      <div class="bg-white p-5 rounded-[2rem] border border-gray-100 mb-4 shadow-sm">
        <div class="flex justify-between items-start mb-3">
          <div>
            <span class="text-[10px] font-bold text-gray-400 block">${new Date(o.timestamp || o.Tanggal).toLocaleDateString('id-ID')}</span>
            <span class="text-orange-600 font-black text-xs uppercase">${o.invoice || 'INV-TEMP'}</span>
          </div>
          <span class="px-3 py-1 rounded-full text-[9px] font-black bg-orange-50 text-orange-600 uppercase tracking-wider">${o.tracking || o.Tracking || 'PO MASUK'}</span>
        </div>
        <p class="text-[11px] text-gray-500 mb-3 line-clamp-1">${o.Pesanan || o.items}</p>
        <div class="flex justify-between items-center pt-3 border-t border-dashed">
          <p class="font-black text-lg">Rp ${Number(o.Total || o.total).toLocaleString('id-ID')}</p>
          <a href="${o.Link_PDF || o.pdf || '#'}" target="_blank" class="text-blue-500 text-[10px] font-bold underline italic">Invoice PDF</a>
        </div>
      </div>
    `).join("");
  };

  window.onload = () => {
    updateCartBadge();
    showPage('home');
  };
</script>

<!-- LOADER -->
<div id="global-loader" class="fixed inset-0 z-[200] bg-white/80 backdrop-blur-sm flex items-center justify-center hidden">
  <div class="text-center">
    <div class="w-10 h-10 border-4 border-orange-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
    <p id="loader-text" class="text-[10px] font-bold text-orange-600 uppercase tracking-widest"></p>
  </div>
</div>

<!-- TOP NAV -->
<nav class="sticky top-0 bg-white/90 backdrop-blur-md z-[100] px-4 py-3 border-b flex justify-between items-center">
  <h1 class="font-black text-orange-600 tracking-tighter text-xl italic">DAPUR GHANIA</h1>
  <div class="relative active:scale-90 transition-all cursor-pointer" onclick="showPage('cart')">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
    </svg>
    <span class="cart-count hidden absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center">0</span>
  </div>
</nav>

<!-- PAGE: HOME -->
<div id="page-home" class="page-content p-4 pb-20">
  <div class="relative mb-6">
    <input oninput="handleSearch(this.value)" type="text" placeholder="Cari menu dapur..." class="w-full bg-white border-none shadow-sm rounded-2xl py-4 px-12 text-sm outline-none focus:ring-2 focus:ring-orange-100">
    <svg class="w-5 h-5 absolute left-4 top-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
  </div>
  <div id="product-grid" class="grid grid-cols-2 gap-4"></div>
</div>

<!-- PAGE: CART -->
<div id="page-cart" class="page-content hidden p-4 pb-64">
  <h2 class="font-black text-2xl mb-6 tracking-tight">Keranjang Belanja</h2>
  
  <div id="cart-items" class="mb-8"></div>
  
  <div class="bg-white p-6 rounded-[2.5rem] border border-gray-100 mb-8 shadow-sm">
    <h3 class="font-black text-xs uppercase text-gray-400 mb-4 tracking-widest">Informasi Pengiriman</h3>
    <div class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] font-bold text-gray-400 ml-1">TANGGAL KIRIM</label>
          <input id="co-date" type="date" class="w-full bg-gray-50 rounded-2xl p-4 text-sm border-none outline-none focus:ring-1 focus:ring-orange-500">
        </div>
        <div>
          <label class="text-[10px] font-bold text-gray-400 ml-1">JAM KIRIM</label>
          <input id="co-time" type="time" class="w-full bg-gray-50 rounded-2xl p-4 text-sm border-none outline-none focus:ring-1 focus:ring-orange-500">
        </div>
      </div>
      <div>
        <label class="text-[10px] font-bold text-gray-400 ml-1">ALAMAT LENGKAP</label>
        <textarea id="co-address" placeholder="Jalan, No Rumah, Kelurahan..." class="w-full bg-gray-50 rounded-2xl p-4 text-sm h-24 border-none outline-none focus:ring-1 focus:ring-orange-500"></textarea>
      </div>
      <div>
        <label class="text-[10px] font-bold text-gray-400 ml-1">CATATAN PESANAN</label>
        <input id="co-note" type="text" placeholder="Contoh: Kurangi gula, pedas, dll..." class="w-full bg-gray-50 rounded-2xl p-4 text-sm border-none outline-none focus:ring-1 focus:ring-orange-500">
      </div>
    </div>
  </div>

  <div class="fixed bottom-20 left-0 right-0 p-6 bg-white border-t z-[110] shadow-[0_-10px_40px_rgba(0,0,0,0.05)] rounded-t-[3rem]">
    <div class="flex justify-between items-center mb-4 px-2">
      <span class="font-bold text-gray-400 text-sm">Total Belanja</span>
      <span id="cart-total" class="font-black text-2xl text-orange-600">Rp 0</span>
    </div>
    <button onclick="processCheckout()" class="w-full bg-orange-600 text-white py-5 rounded-3xl font-black shadow-xl shadow-orange-200 active:scale-95 transition-transform uppercase tracking-widest text-sm">Konfirmasi Pemesanan</button>
  </div>
</div>

<!-- PAGE: PROFILE -->
<div id="page-profile" class="page-content hidden p-6 pb-24 text-center">
  <div class="w-20 h-20 bg-orange-600 text-white rounded-[2rem] mx-auto flex items-center justify-center mb-6 shadow-lg rotate-3">
    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
  </div>
  <h2 id="prof-title" class="font-black text-2xl mb-2 italic uppercase">Masuk / Daftar</h2>
  
  <div id="login-form-container" class="mt-8">
    <form onsubmit="handleAuth(event)" class="text-left space-y-4 max-w-sm mx-auto">
      <div>
        <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Nama Lengkap (Kosongkan jika hanya login)</label>
        <input id="prof-name" type="text" class="w-full bg-white border border-gray-100 rounded-2xl p-4 shadow-sm outline-none focus:ring-1 focus:ring-orange-500" placeholder="Isi untuk Daftar Baru">
      </div>
      <div>
        <label class="text-[10px] font-black uppercase text-gray-400 ml-2">Nomor WhatsApp</label>
        <input id="prof-phone" type="tel" class="w-full bg-white border border-gray-100 rounded-2xl p-4 shadow-sm outline-none focus:ring-1 focus:ring-orange-500" placeholder="08xxxxxxxxxx">
      </div>
      <div>
        <label class="text-[10px] font-black uppercase text-gray-400 ml-2">PIN Keamanan (6 Digit)</label>
        <input id="prof-pin" type="password" maxlength="6" class="w-full bg-white border border-gray-100 rounded-2xl p-4 shadow-sm outline-none focus:ring-1 focus:ring-orange-500" placeholder="******">
      </div>
      <button type="submit" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black shadow-lg uppercase tracking-wider">Lanjutkan</button>
    </form>
  </div>

  <div id="profile-info-container" class="hidden mt-8 max-w-sm mx-auto bg-white p-6 rounded-3xl border shadow-sm text-left">
     <div class="flex justify-between items-start mb-4">
       <div>
         <p class="text-xs font-bold text-gray-400 uppercase">Nama Terdaftar</p>
         <p id="display-name" class="text-xl font-black text-gray-800"></p>
       </div>
       <span id="admin-badge" class="hidden bg-red-100 text-red-600 text-[10px] font-black px-3 py-1 rounded-full uppercase italic">Admin</span>
     </div>
     <p class="text-xs font-bold text-gray-400 uppercase">WhatsApp</p>
     <p id="display-phone" class="text-lg font-bold text-orange-600 italic"></p>
  </div>
  
  <div id="logout-btn" class="mt-12 hidden">
    <button onclick="logout()" class="text-red-500 font-bold text-sm underline italic">Keluar dari Akun</button>
  </div>
</div>

<!-- PAGE: HISTORY -->
<div id="page-history" class="page-content hidden p-4 pb-24">
  <h2 class="font-black text-2xl mb-6">Riwayat Pesanan</h2>
  <div id="history-list"></div>
</div>

<!-- BOTTOM NAV -->
<div id="main-nav" class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t px-8 py-4 flex justify-between items-center z-[110]">
  <button id="nav-home" onclick="showPage('home')" class="nav-item flex flex-col items-center gap-1 transition-all">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
  </button>
  <button id="nav-history" onclick="showPage('history')" class="nav-item flex flex-col items-center gap-1 text-gray-400 transition-all">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
  </button>
  <button id="nav-profile" onclick="showPage('profile')" class="nav-item flex flex-col items-center gap-1 text-gray-400 transition-all">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
  </button>
</div>

<!-- MODALS -->
<div id="modal-auth-prompt" class="fixed inset-0 z-[160] hidden flex items-center justify-center p-4 modal-blur">
  <div class="bg-white w-full max-w-sm rounded-[3rem] p-8 shadow-2xl text-center">
    <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full mx-auto flex items-center justify-center mb-6">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
    </div>
    <h3 class="font-black text-xl mb-2">Belum Masuk Akun</h3>
    <p class="text-sm text-gray-500 mb-8">Silakan masuk atau daftar terlebih dahulu untuk melanjutkan pesanan Anda.</p>
    <div class="space-y-3">
      <button onclick="document.getElementById('modal-auth-prompt').classList.add('hidden'); showPage('profile');" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black">Masuk / Daftar Sekarang</button>
      <button onclick="document.getElementById('modal-auth-prompt').classList.add('hidden')" class="w-full bg-gray-100 text-gray-500 py-4 rounded-2xl font-bold text-sm">Nanti Saja</button>
    </div>
  </div>
</div>

<div id="modal-product" class="fixed inset-0 z-[150] hidden flex items-end justify-center sm:items-center p-0 sm:p-4 modal-blur" onclick="if(event.target === this) closeProductDetail()">
  <div class="bg-white w-full max-w-md rounded-t-[3rem] sm:rounded-[4rem] overflow-hidden shadow-2xl transition-all">
    <img id="dp-img" class="w-full h-72 object-cover">
    <div class="p-10 text-center">
      <h3 id="dp-name" class="font-black text-2xl text-gray-800 mb-3 tracking-tight"></h3>
      <p id="dp-desc" class="text-sm text-gray-400 leading-relaxed mb-8"></p>
      <div class="mb-10">
        <p id="dp-price" class="font-black text-orange-600 text-4xl italic"></p>
      </div>
      <button onclick="addToCart(selectedProduct?.id); closeProductDetail();" class="w-full bg-orange-600 text-white py-6 rounded-[2rem] font-black shadow-xl shadow-orange-100 active:scale-95 transition-transform">Tambah ke Keranjang</button>
    </div>
  </div>
</div>

</body>
</html>
