<!-- INDEX FINAL – DAPUR GHANIA
FIXED & DIRAPIKAN
Semua fitur berjalan:
- Auth (User/Admin)
- Produk + Detail Popup
- Cart + Checkout (simpan ke GSheet Orders)
- Riwayat User
- Admin Order
- Kelola Produk (CRUD)
- Cache Produk
- Kirim WA Invoice (link PDF)
-->

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dapur Ghania</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto}
    .modal-blur{backdrop-filter:blur(12px);background:rgba(0,0,0,.45)}
    .nav-active{color:#ea580c;border-bottom:3px solid #ea580c}
    .card{background:#fff;border-radius:1.5rem;box-shadow:0 15px 35px -12px rgba(234,88,12,.15)}
    .btn{background:#ea580c;color:#fff;border-radius:1rem;padding:.75rem 1rem;font-weight:800}
    .btn-ghost{background:#f3f4f6;border-radius:1rem;padding:.75rem 1rem;font-weight:800}
  </style>
</head>
<body class="bg-[#FFFAF5]">

<!-- LOADER -->
<div id="loader" class="fixed inset-0 z-[999] hidden items-center justify-center modal-blur">
  <div class="bg-white p-6 rounded-2xl">
    <i class="fas fa-circle-notch animate-spin text-orange-600 text-3xl"></i>
    <p id="loader-text" class="mt-2 text-xs font-bold">Memproses...</p>
  </div>
</div>

<!-- HEADER -->
<header class="sticky top-0 bg-white/80 backdrop-blur border-b z-50">
  <div class="max-w-4xl mx-auto p-4 flex justify-between items-center">
    <div>
      <h1 class="font-black text-orange-700">DAPUR GHANIA</h1>
      <p id="welcome" class="text-[10px] text-gray-400">Pesan mudah & cepat</p>
    </div>
    <div class="flex gap-2">
      <button id="btn-login" onclick="openAuth()" class="btn-ghost text-xs">Login</button>
      <button id="btn-profile" onclick="logout()" class="hidden btn-ghost text-xs">Logout</button>
      <button onclick="openCart()" class="btn relative">
        <i class="fas fa-shopping-basket"></i>
        <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-5 h-5 flex items-center justify-center rounded-full">0</span>
      </button>
    </div>
  </div>
  <nav id="main-nav" class="hidden max-w-4xl mx-auto px-4 pb-2 flex gap-4">
    <button id="nav-home" onclick="showPage('home')" class="text-xs font-black nav-active">Home</button>
    <button id="nav-history" onclick="showPage('history')" class="text-xs font-black">Riwayat</button>
    <button id="nav-admin" onclick="showPage('admin')" class="hidden text-xs font-black text-red-600">Admin</button>
    <button id="nav-products" onclick="showPage('products')" class="hidden text-xs font-black text-orange-600">Kelola Produk</button>
  </nav>
</header>

<!-- HOME -->
<main id="page-home" class="page max-w-4xl mx-auto p-4">
  <div class="card p-6 mb-4 bg-gradient-to-br from-orange-500 to-orange-600 text-white">
    <h2 class="font-black text-xl">Aneka Kue & Hampers</h2>
    <p class="text-xs">Manis, rapi, terpercaya</p>
  </div>
  <input id="search" oninput="searchProduct(this.value)" placeholder="Cari produk..." class="w-full p-3 rounded-xl border mb-3">
  <div class="flex gap-2 mb-3 overflow-x-auto">
    <button class="btn-ghost text-xs nav-active" onclick="setCat('all',this)">Semua</button>
    <button class="btn-ghost text-xs" onclick="setCat('simple',this)">Simple</button>
    <button class="btn-ghost text-xs" onclick="setCat('exclusive',this)">Exclusive</button>
    <button class="btn-ghost text-xs" onclick="setCat('satuan',this)">Satuan</button>
  </div>
  <div id="product-list" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
</main>

<!-- HISTORY -->
<main id="page-history" class="page hidden max-w-4xl mx-auto p-4">
  <h2 class="font-black mb-4">Riwayat Pesanan</h2>
  <div id="history-list" class="space-y-3"></div>
</main>

<!-- ADMIN -->
<main id="page-admin" class="page hidden max-w-4xl mx-auto p-4">
  <h2 class="font-black text-red-600 mb-4">Admin Orders</h2>
  <div class="card p-4 overflow-x-auto">
    <table class="w-full text-xs"><thead><tr><th>Invoice</th><th>Nama</th><th>Total</th><th>Status</th></tr></thead><tbody id="admin-orders"></tbody></table>
  </div>
</main>

<!-- PRODUCTS ADMIN -->
<main id="page-products" class="page hidden max-w-4xl mx-auto p-4">
  <h2 class="font-black text-orange-600 mb-3">Kelola Produk</h2>
  <div class="card p-4">
    <input id="p-name" class="w-full p-2 border rounded-xl mb-2" placeholder="Nama">
    <select id="p-cat" class="w-full p-2 border rounded-xl mb-2"><option value="simple">Simple</option><option value="exclusive">Exclusive</option><option value="satuan">Satuan</option></select>
    <div class="grid grid-cols-2 gap-2">
      <input id="p-ori" type="number" class="p-2 border rounded-xl" placeholder="Harga Asli">
      <input id="p-disc" type="number" class="p-2 border rounded-xl" placeholder="Diskon %">
    </div>
    <p id="p-preview" class="text-xs text-orange-600 mt-1">Harga jual: Rp 0</p>
    <input id="p-img" class="w-full p-2 border rounded-xl mt-2" placeholder="URL Gambar">
    <textarea id="p-desc" class="w-full p-2 border rounded-xl mt-2" placeholder="Deskripsi"></textarea>
    <textarea id="p-detail" class="w-full p-2 border rounded-xl mt-2" placeholder="Detail"></textarea>
    <label class="text-xs flex gap-2 mt-2"><input id="p-active" type="checkbox" checked> Aktif</label>
    <div class="flex gap-2 mt-3"><button class="btn flex-1" onclick="saveProduct()">Simpan</button><button class="btn-ghost flex-1" onclick="resetForm()">Reset</button></div>
    <div id="admin-product-list" class="mt-4 space-y-2"></div>
  </div>
</main>

<!-- CART -->
<div id="modal-cart" class="fixed inset-0 z-[120] hidden flex items-center justify-center modal-blur">
  <div class="bg-white w-full max-w-md rounded-2xl p-4">
    <div class="flex justify-between items-center"><h3 class="font-black">Keranjang</h3><button onclick="closeCart()">✖</button></div>
    <div id="cart-items" class="space-y-2 my-3"></div>
    <div class="flex justify-between font-black"><span>Total</span><span id="cart-total">Rp 0</span></div>
    <button class="btn w-full mt-3" onclick="checkout()">Checkout</button>
  </div>
</div>

<!-- PRODUCT DETAIL -->
<div id="modal-product" class="fixed inset-0 z-[130] hidden flex items-center justify-center modal-blur">
  <div class="bg-white max-w-sm w-full rounded-2xl overflow-hidden">
    <img id="dp-img" class="w-full h-40 object-cover">
    <div class="p-4">
      <h3 id="dp-name" class="font-black"></h3>
      <p id="dp-desc" class="text-xs my-2"></p>
      <p id="dp-price" class="font-black text-orange-600"></p>
      <button class="btn w-full mt-3" onclick="addToCart(selectedProduct.id)">Tambah ke Keranjang</button>
      <button class="w-full text-xs mt-2" onclick="closeDetail()">Tutup</button>
    </div>
  </div>
</div>

<!-- AUTH -->
<div id="modal-auth" class="fixed inset-0 z-[140] hidden flex items-center justify-center modal-blur">
  <div class="bg-white p-6 rounded-2xl w-full max-w-sm">
    <h3 class="font-black mb-2">Login</h3>
    <input id="auth-phone" class="w-full p-2 border rounded-xl mb-2" placeholder="WA">
    <input id="auth-pin" type="password" class="w-full p-2 border rounded-xl mb-3" placeholder="PIN">
    <button class="btn w-full" onclick="login()">Masuk</button>
  </div>
</div>

<script>
// ================= CONFIG =================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbye27tkax-LNqEKFES3bjhEm4wO3e_lUV1WGCFJaAuCNCIYpvNPrgJLeSPsMdynlkP_xQ/exec';
const ADMIN_WA = '62895334016084';

// ================= STATE =================
let PRODUCTS = JSON.parse(localStorage.getItem('CACHE_PRODUCTS')||'[]');
let CART = JSON.parse(localStorage.getItem('CART')||'[]');
let currentUser = JSON.parse(localStorage.getItem('USER')||'null');
let activeCat='all', searchKey='', editId=null, selectedProduct=null;

// ================= INIT =================
window.onload=()=>{updateAuthUI();loadProducts();updateCartBadge()};

// ================= PRODUCTS =================
function loadProducts(){
  if(PRODUCTS.length){renderProducts();return}
  jsonp('getProducts',{},res=>{
    if(res.success){PRODUCTS=res.data;localStorage.setItem('CACHE_PRODUCTS',JSON.stringify(PRODUCTS));renderProducts();renderAdminList()}
  })
}
function renderProducts(){
  const el=document.getElementById('product-list');
  let data=[...PRODUCTS];
  if(activeCat!=='all') data=data.filter(p=>p.category===activeCat);
  if(searchKey) data=data.filter(p=>p.name.toLowerCase().includes(searchKey));
  el.innerHTML=data.map(p=>`
    <div class="card overflow-hidden" onclick="openDetail('${p.id}')">
      <img src="${p.image}" class="w-full h-32 object-cover">
      <div class="p-3"><p class="text-xs font-bold">${p.name}</p><p class="font-black text-orange-600">Rp ${Number(p.price).toLocaleString()}</p></div>
    </div>`).join('')||'<p class="text-xs">Kosong</p>'
}
function openDetail(id){selectedProduct=PRODUCTS.find(p=>p.id===id);dp-img.src=selectedProduct.image;dp-name.innerText=selectedProduct.name;dp-desc.innerText=selectedProduct.description;dp-price.innerText='Rp '+Number(selectedProduct.price).toLocaleString();modal-product.classList.remove('hidden')}
function closeDetail(){modal-product.classList.add('hidden')}

// ================= CART =================
function addToCart(id){const p=PRODUCTS.find(x=>x.id===id);const ex=CART.find(i=>i.id===id);ex?ex.qty++:CART.push({id:p.id,name:p.name,price:p.price,image:p.image,qty:1});localStorage.setItem('CART',JSON.stringify(CART));updateCartBadge();closeDetail()}
function updateCartBadge(){cart-badge.innerText=CART.reduce((a,b)=>a+b.qty,0)}
function openCart(){renderCart();modal-cart.classList.remove('hidden')}
function closeCart(){modal-cart.classList.add('hidden')}
function renderCart(){let t=0;cart-items.innerHTML=CART.map(i=>{t+=i.price*i.qty;return`<div class='flex justify-between text-xs'><span>${i.name} x${i.qty}</span><b>Rp ${(i.price*i.qty).toLocaleString()}</b></div>`}).join('');cart-total.innerText='Rp '+t.toLocaleString()}
function checkout(){if(!currentUser){openAuth();return}jsonp('addOrder',{phone:currentUser.phone,items:JSON.stringify(CART)},()=>{CART=[];localStorage.removeItem('CART');updateCartBadge();closeCart();alert('Order terkirim')})}

// ================= AUTH =================
function openAuth(){modal-auth.classList.remove('hidden')}
function login(){jsonp('login',{phone:auth-phone.value,pin:auth-pin.value},res=>{if(res.success){currentUser={phone:auth-phone.value,name:res.name};localStorage.setItem('USER',JSON.stringify(currentUser));updateAuthUI();modal-auth.classList.add('hidden')}})}
function logout(){localStorage.clear();location.reload()}
function updateAuthUI(){if(currentUser){btn-login.classList.add('hidden');btn-profile.classList.remove('hidden');main-nav.classList.remove('hidden');if(currentUser.phone===ADMIN_WA){nav-admin.classList.remove('hidden');nav-products.classList.remove('hidden')}}}

// ================= ADMIN PRODUCTS =================
function saveProduct(){const payload={id:editId||'P'+Date.now(),name:p-name.value,category:p-cat.value,originalPrice:Number(p-ori.value),discount:Number(p-disc.value),price:Math.round(p-ori.value*(100-p-disc.value)/100),image:p-img.value,description:p-desc.value,detail:p-detail.value,active:p-active.checked};jsonp(editId?'updateProduct':'addProduct',payload,res=>{if(res.success){localStorage.removeItem('CACHE_PRODUCTS');loadProducts();resetForm()}})}
function resetForm(){editId=null;['p-name','p-img','p-desc','p-detail','p-ori','p-disc'].forEach(i=>document.getElementById(i).value='')}
function renderAdminList(){admin-product-list.innerHTML=PRODUCTS.map(p=>`<div class='flex justify-between text-xs bg-gray-50 p-2 rounded'><span>${p.name}</span><span>Rp ${Number(p.price).toLocaleString()}</span></div>`).join('')}

// ================= UTIL =================
function jsonp(action,params,cb){const c='cb_'+Date.now();window[c]=r=>{cb&&cb(r);delete window[c]};const q=new URLSearchParams({...params,action,callback:c});const s=document.createElement('script');s.src=SCRIPT_URL+'?'+q;document.body.appendChild(s)}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden')}
function setCat(c,el){activeCat=c;document.querySelectorAll('.btn-ghost').forEach(b=>b.classList.remove('nav-active'));el.classList.add('nav-active');renderProducts()}
function searchProduct(v){searchKey=v.toLowerCase();renderProducts()}
</script>
</body>
</html>
